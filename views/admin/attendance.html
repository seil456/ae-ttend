<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AE-ttend - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              langit: "#2d728f",
              pasifik: "#3b8ea5",
              vanila: "#f5ee9e",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b8ea5;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased overflow-hidden">
    <div class="flex h-screen w-full">
      <aside
        class="w-64 flex-shrink-0 bg-langit text-white flex flex-col transition-all duration-300 shadow-xl z-20"
      >
        <div class="h-16 flex items-center px-6 border-b border-pasifik/50">
          <div class="flex items-center gap-3">
            <div
              class="w-8 h-8 bg-vanila rounded-lg flex items-center justify-center shadow-inner"
            >
              <svg
                class="w-5 h-5 text-langit"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                ></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-vanila tracking-wider">
              AE-ttend
            </h2>
          </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
          <a
            href="dashboard.html"
            class="flex items-center px-4 py-3 hover:bg-pasifik/40 text-white/80 hover:text-white rounded-xl transition-all duration-200"
          >
            <svg
              class="w-5 h-5 mr-3 opacity-70"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              ></path>
            </svg>
            <span class="font-medium">Home</span>
          </a>
          <!-- users -->
          <a
            href="users.html"
            class="flex items-center px-4 py-3 hover:bg-pasifik/40 text-white/80 hover:text-white rounded-xl transition-all duration-200"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5 mr-3 opacity-70"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z"
              />
            </svg>
            <span class="font-medium">Users</span>
          </a>
          <a
            href="locations.html"
            class="flex items-center px-4 py-3 hover:bg-pasifik/40 text-white/80 hover:text-white rounded-xl transition-all duration-200"
          >
            <svg
              class="w-5 h-5 mr-3 opacity-70"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
            <span class="font-medium">Locations</span>
          </a>
          <a
            href="attendance.html"
            class="flex items-center px-4 py-3 bg-pasifik text-white rounded-xl shadow-md shadow-pasifik/30 transition-colors"
          >
            <svg
              class="w-5 h-5 mr-3 text-vanila"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
              ></path>
            </svg>
            <span class="font-medium">Attendance</span>
          </a>
          <a
            href="settings.html"
            class="flex items-center px-4 py-3 hover:bg-pasifik/40 text-white/80 hover:text-white rounded-xl transition-all duration-200"
          >
            <svg
              class="w-5 h-5 mr-3 opacity-70"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
            <span class="font-medium">Settings</span>
          </a>
        </nav>
      </aside>

      <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header
          class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-10 sticky top-0"
        >
          <div class="flex items-center">
            <h1 class="text-xl font-bold text-langit">Halo, Admin!</h1>
          </div>
          <div class="flex items-center gap-5">
            <button
              class="relative p-2 text-langit hover:bg-vanila/30 transition-colors rounded-full"
            >
              <span
                class="absolute top-1.5 right-1.5 w-2 h-2 bg-pasifik rounded-full border-2 border-white"
              ></span>
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                ></path>
              </svg>
            </button>

            <div class="flex items-center gap-3 cursor-pointer group">
              <div class="text-right hidden md:block">
                <p
                  class="text-sm font-semibold text-langit group-hover:text-pasifik transition-colors"
                >
                  Admin System
                </p>
                <p class="text-xs text-slate-500">Administrator</p>
              </div>
              <div
                class="w-10 h-10 rounded-full bg-vanila border-2 border-langit shadow-sm overflow-hidden flex items-center justify-center"
              >
                <span class="font-bold text-langit text-sm">AD</span>
              </div>
            </div>
          </div>
        </header>
        <main class="flex-1 overflow-y-auto p-8">
          <div class="max-w-7xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
            <!-- Header -->
            <div
              class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8"
            >
              <div>
                <h2 class="text-2xl font-bold text-langit">Attendance Management</h2>
                <p class="text-gray-500 text-sm">Manage attendance data</p>
              </div>

              <button
                onclick="openModal()"
                class="bg-pasifik hover:bg-langit text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all shadow-md active:scale-95"
              >
                <i class="fas fa-plus"></i> + Attendance
              </button>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto rounded-xl border border-gray-100">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-pasifik text-white">
                    <th class="p-4 text-xs font-semibold uppercase">NIM</th>
                    <th class="p-4 text-xs font-semibold uppercase">Student</th>
                    <th class="p-4 text-xs font-semibold uppercase">Date</th>
                    <th class="p-4 text-xs font-semibold uppercase text-center">
                      Check-in
                    </th>
                    <th class="p-4 text-xs font-semibold uppercase text-center">
                      Check-out
                    </th>
                    <th class="p-4 text-xs font-semibold uppercase text-center">
                      Status
                    </th>
                    <th class="p-4 text-xs font-semibold uppercase text-center">
                      Action
                    </th>
                  </tr>
                </thead>

                <tbody class="divide-y divide-gray-100">
                  <!-- Dummy Row -->
                  <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 text-sm font-bold text-gray-700">2026001</td>
                    <td class="p-4 text-sm font-semibold text-langit">
                      <div class="flex items-center gap-3">
                        <div class="bg-gray-200 border-2 border-dashed rounded-full w-12 h-12">
                          <img src="../../public/images/userPics/bjhabibie2.png" alt="userPic" class="w-full h-full object-cover rounded-full" />
                        </div>
                        <div>
                          <p class="text-sm font-bold">John Doe</p>
                          <p class="text-xs text-gray-500">TRIN | 1AEC2</p>
                        </div>
                      </div>
                    </td>
                    <td class="p-4 text-sm text-gray-600">2023-10-15</td>
                    <td class="p-4 text-sm text-gray-500 text-center">08:00</td>
                    <td class="p-4 text-sm text-gray-500 text-center">16:00</td>
                    <td class="p-4 text-center">
                      <span
                        class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase"
                        >Active</span
                      >
                    </td>
                    <td class="p-4">
                      <div class="flex justify-center gap-3 text-lg">
                        <i
                          class="fas fa-eye text-pasifik hover:scale-125 cursor-pointer"
                        ></i>
                        <i
                          class="fas fa-edit text-langit hover:scale-125 cursor-pointer"
                        ></i>
                        <i
                          class="fas fa-trash text-red-500 hover:scale-125 cursor-pointer"
                        ></i>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- MODAL -->
          <div
            id="modalAdd"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-all duration-300"
          >
            <div
              class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-all duration-300"
            >
              <div
                class="bg-langit p-6 text-white flex justify-between items-center"
              >
                <h3 class="text-xl font-bold">Add New User</h3>
                <button onclick="closeModal()">
                  <i class="fas fa-times text-2xl"></i>
                </button>
              </div>

              <form class="p-8 space-y-4">
                <input
                  type="text"
                  placeholder="NIM"
                  class="w-full px-4 py-3 border rounded-xl"
                />
                <input
                  type="text"
                  placeholder="Nama"
                  class="w-full px-4 py-3 border rounded-xl"
                />
                <input
                  type="text"
                  placeholder="Kelas"
                  class="w-full px-4 py-3 border rounded-xl"
                />

                <div class="flex gap-3 pt-4">
                  <button
                    type="button"
                    onclick="closeModal()"
                    class="flex-1 py-3 border rounded-xl"
                  >
                    Cancel
                  </button>
                  <button class="flex-1 py-3 bg-pasifik text-white rounded-xl">
                    Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
