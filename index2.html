<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sky-blue': '#2d728f',
                        'pacific-blue': '#3b8ea5',
                        'vanilla': '#f5ee9e',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-50">

    <div class="flex w-full max-w-[900px] bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[550px]">
        
        <div class="w-full md:w-1/2 p-10 sm:p-14 flex flex-col justify-center relative">
            
            <img src="image_31dc54.jpg" alt="Logo" class="w-12 h-12 rounded-full object-cover shadow-sm mb-8 border border-gray-100">

            <h1 class="text-3xl font-bold text-gray-900 mb-2">Selamat Datang</h1>
            <p class="text-gray-500 text-sm mb-8 font-medium">Silakan masuk ke akun Anda.</p>

            <form action="#" method="POST" class="space-y-5">
                
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">NIM / ID</label>
                    <input type="text" id="username" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-pacific-blue focus:border-pacific-blue outline-none transition-all text-gray-700 bg-white" placeholder="Masukkan ID Anda" required>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Kata Sandi</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-pacific-blue focus:border-pacific-blue outline-none transition-all text-gray-700 bg-white" placeholder="••••••••" required>
                </div>

                <div class="flex items-center justify-end mt-2">
                    <a href="#" class="text-sm font-bold text-sky-blue hover:text-pacific-blue transition-colors">Lupa sandi?</a>
                </div>

                <button type="submit" class="w-full bg-sky-blue hover:bg-pacific-blue text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 mt-2">
                    Masuk
                </button>
            </form>
        </div>

        <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-sky-blue to-pacific-blue items-center justify-center relative overflow-hidden p-12">
            
            <div class="absolute w-72 h-72 bg-white/10 rounded-full -top-10 -right-10 blur-3xl"></div>
            <div class="absolute w-72 h-72 bg-vanilla/20 rounded-full bottom-10 -left-10 blur-3xl"></div>
        </div>
    </div>

</body>
</html>
